<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 1152" width="928" height="1152">
  <defs>
    <linearGradient id="fabricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041531" />
      <stop offset="35%" stop-color="#0a2550" />
      <stop offset="70%" stop-color="#051838" />
      <stop offset="100%" stop-color="#030f24" />
    </linearGradient>
    <linearGradient id="foldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3166" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#04132b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b2957" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041838" />
      <stop offset="100%" stop-color="#062047" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3166" />
      <stop offset="100%" stop-color="#092552" />
    </linearGradient>
    <linearGradient id="handSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0ac8b" />
      <stop offset="60%" stop-color="#c68b67" />
      <stop offset="100%" stop-color="#a36b49" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-12" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Rich Draped Navy Blue Fabric Background -->
  <rect width="928" height="1152" fill="url(#fabricBg)" />
  <path d="M-100,220 Q280,60 980,380 L980,640 Q320,310 -100,520 Z" fill="url(#foldGrad1)" />
  <path d="M-80,740 Q380,520 1020,820 L1020,1152 L-80,1152 Z" fill="url(#foldGrad1)" />

  <!-- Three Sky Blue Accent Rays on Right of Phone -->
  <g stroke="#1da1f2" stroke-width="10" stroke-linecap="round">
    <line x1="704" y1="302" x2="726" y2="268" />
    <line x1="716" y1="316" x2="758" y2="294" />
    <line x1="720" y1="332" x2="756" y2="334" />
  </g>

  <!-- Left Hand Fingers Holding Phone -->
  <g fill="url(#handSkin)" stroke="#8c583a" stroke-width="2">
    <!-- Palm & Bottom Hand -->
    <path d="M460,1010 Q560,1180 780,1170 L928,1170 L928,740 Q860,640 780,540 L690,880 Z" />
    <!-- Left Fingers Wrapping Around Bezel -->
    <rect x="172" y="518" width="58" height="92" rx="28" transform="rotate(-8 172 518)" />
    <rect x="184" y="642" width="58" height="92" rx="28" transform="rotate(-8 184 642)" />
    <rect x="206" y="768" width="58" height="88" rx="28" transform="rotate(-8 206 768)" />
  </g>

  <!-- Tilted Smartphone Container -->
  <g transform="translate(468, 560) rotate(-6) translate(-260, -455)" filter="url(#phoneShadow)">
    <!-- Outer Metallic Frame -->
    <rect x="0" y="0" width="520" height="910" rx="68" fill="url(#phoneBody)" stroke="#94a3b8" stroke-width="4" />
    <!-- Inner Black Bezel -->
    <rect x="12" y="12" width="496" height="886" rx="58" fill="#050811" />
    <!-- Screen Viewport -->
    <rect x="24" y="24" width="472" height="862" rx="48" fill="url(#screenBg)" />

    <!-- Top Notch -->
    <path d="M168,24 L352,24 L352,38 C352,50 342,58 330,58 L190,58 C178,58 168,50 168,38 Z" fill="#050811" />
    <rect x="235" y="34" width="50" height="6" rx="3" fill="#1e293b" />
    <circle cx="302" cy="37" r="5" fill="#1e3a8a" />

    <!-- Status Bar -->
    <text x="56" y="56" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="20" font-weight="700">9:30</text>
    <!-- Signal / Wifi / Battery -->
    <g fill="#FFFFFF" transform="translate(382, 40)">
      <rect x="0" y="10" width="4" height="6" rx="1" />
      <rect x="6" y="7" width="4" height="9" rx="1" />
      <rect x="12" y="4" width="4" height="12" rx="1" />
      <rect x="18" y="0" width="4" height="16" rx="1" />
      <rect x="48" y="2" width="26" height="13" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <rect x="50" y="4" width="20" height="9" rx="1.5" />
    </g>

    <!-- Trench Brand Logo & Wordmark -->
    <g transform="translate(88, 102)">
      <!-- T Logo -->
      <polygon points="0,0 58,0 48,12 22,12 22,52 10,62 10,12 0,12" fill="#FFFFFF" />
      <polygon points="26,18 46,18 40,28 34,28 34,46 26,52" fill="#1da1f2" />
      <text x="68" y="42" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">trench</text>
    </g>

    <!-- "Choose Your Fit" Heading -->
    <text x="68" y="218" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Choose</text>
    <text x="68" y="268" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Your Fit</text>

    <!-- Category Card 1: Suits -->
    <g transform="translate(48, 304)">
      <rect width="424" height="126" rx="22" fill="url(#cardBg)" stroke="#1e4b8a" stroke-width="2" />
      <!-- Navy Suit Jacket Illustration -->
      <g transform="translate(22, 8)">
        <path d="M25,18 L65,6 L105,6 L145,18 L162,118 L8,118 Z" fill="#102342" stroke="#1e3a68" stroke-width="1.5" />
        <polygon points="65,6 85,58 105,6" fill="#f8fafc" />
        <polygon points="81,16 89,16 92,62 85,72 78,62" fill="#2b7de9" />
      </g>
      <text x="218" y="74" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="30" font-weight="700">Suits</text>
      <polyline points="380,52 396,65 380,78" fill="none" stroke="#1da1f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Category Card 2: Shirts -->
    <g transform="translate(48, 446)">
      <rect width="424" height="126" rx="22" fill="url(#cardBg)" stroke="#1e4b8a" stroke-width="2" />
      <!-- Light Blue Dress Shirt Illustration -->
      <g transform="translate(26, 10)">
        <path d="M22,18 L58,6 L102,6 L138,18 L154,116 L6,116 Z" fill="#9bc2f5" stroke="#bfdbfe" stroke-width="1.5" />
        <polygon points="58,6 80,26 102,6" fill="#6ca0e8" />
        <line x1="80" y1="26" x2="80" y2="116" stroke="#dbeafe" stroke-width="2" />
      </g>
      <text x="218" y="74" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="30" font-weight="700">Shirts</text>
      <polyline points="380,52 396,65 380,78" fill="none" stroke="#1da1f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Category Card 3: Trousers -->
    <g transform="translate(48, 588)">
      <rect width="424" height="126" rx="22" fill="url(#cardBg)" stroke="#1e4b8a" stroke-width="2" />
      <!-- Navy Pleated Trousers Illustration -->
      <g transform="translate(42, 8)">
        <path d="M18,6 L118,6 L128,118 L74,118 L68,46 L62,118 L8,118 Z" fill="#13284c" stroke="#254275" stroke-width="1.5" />
        <rect x="18" y="6" width="100" height="12" fill="#0d1d38" />
      </g>
      <text x="218" y="74" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="30" font-weight="700">Trousers</text>
      <polyline points="380,52 396,65 380,78" fill="none" stroke="#1da1f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Category Card 4: Ethnic -->
    <g transform="translate(48, 730)">
      <rect width="424" height="120" rx="22" fill="url(#cardBg)" stroke="#1e4b8a" stroke-width="2" />
      <!-- Cream Bandhgala Ethnic Jacket Illustration -->
      <g transform="translate(24, 8)">
        <path d="M24,22 L62,10 L102,10 L140,22 L154,112 L10,112 Z" fill="#efe3ce" stroke="#d6c4a5" stroke-width="1.5" />
        <rect x="62" y="2" width="40" height="14" rx="4" fill="#dcc8a9" />
        <circle cx="82" cy="36" r="3.5" fill="#b5945b" />
        <circle cx="82" cy="58" r="3.5" fill="#b5945b" />
        <circle cx="82" cy="80" r="3.5" fill="#b5945b" />
      </g>
      <text x="218" y="72" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="30" font-weight="700">Ethnic</text>
      <polyline points="380,50 396,63 380,76" fill="none" stroke="#1da1f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Right Thumb Holding Phone Edge -->
  <path
    d="M726,455 C692,462 686,515 702,575 C718,635 758,720 792,795 L928,795 L928,530 C870,485 772,445 726,455 Z"
    fill="url(#handSkin)"
    stroke="#8c583a"
    stroke-width="2"
  />
  <!-- Thumb Nail Highlight -->
  <path d="M706,475 C722,472 738,488 740,518 C725,522 708,512 706,475 Z" fill="#ecc7b0" opacity="0.65" />
</svg>
